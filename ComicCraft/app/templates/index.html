<section class="card">

    <h2>Create Your Comic</h2>

    <form id="comicForm">

        <div class="grid">

            <div class="field">
                <label for="title">Comic Title</label>
                <input
                    type="text"
                    id="title"
                    name="title"
                    value="The Magic Book"
                    required
                >
            </div>

            <div class="field">
                <label for="panels">Number of Panels</label>
                <input
                    type="number"
                    id="panels"
                    name="panels"
                    value="{{ default_panels }}"
                    min="{{ min_panels }}"
                    max="{{ max_panels }}"
                    required
                >
            </div>

            <div class="field">
                <label for="character">Main Character</label>
                <input
                    type="text"
                    id="character"
                    name="character"
                    placeholder="Example: Sri, a young college student"
                    required
                >
            </div>

            <div class="field">
                <label for="setting">Setting</label>
                <input
                    type="text"
                    id="setting"
                    name="setting"
                    placeholder="Example: Ancient magical library"
                    required
                >
            </div>

            <div class="field">
                <label for="tone">Story Tone</label>
                <input
                    type="text"
                    id="tone"
                    name="tone"
                    value="Adventure and mystery"
                >
            </div>

            <div class="field">
                <label for="art_style">Art Style</label>
                <input
                    type="text"
                    id="art_style"
                    name="art_style"
                    value="Cinematic comic book"
                >
            </div>

            <div class="field full">
                <label for="story">Story Prompt</label>
                <textarea
                    id="story"
                    name="story"
                    required
                >Sri discovers a mysterious glowing book inside an ancient library. When she opens it, a magical portal appears and takes her into a hidden world. She must discover the secret of the book and find her way back home.</textarea>
            </div>

</section>

    ComicCraft AI · Story + AI Images

<script>

const form = document.getElementById("comicForm");
const button = document.getElementById("generateBtn");
const statusBox = document.getElementById("status");
const result = document.getElementById("result");
const comicHeader = document.getElementById("comicHeader");
const panelsContainer = document.getElementById("panelsContainer");


function showStatus(message, type = "") {

    statusBox.style.display = "block";

    statusBox.className = "status " + type;

    statusBox.textContent = message;
}


function escapeHtml(value) {

    if (value === null || value === undefined) {
        return "";
    }

    return String(value)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
}


function renderComic(comic) {

    result.style.display = "block";

    comicHeader.innerHTML = `
        <div class="comic-title">
            ${escapeHtml(comic.title)}
        </div>

        <div class="logline">
            ${escapeHtml(comic.logline)}
        </div>

        <div class="story-info">

            <div class="info-box">
                <strong>Main Character</strong>
                <span>${escapeHtml(comic.character)}</span>
            </div>

            <div class="info-box">
                <strong>Setting</strong>
                <span>${escapeHtml(comic.setting)}</span>
            </div>

            <div class="info-box">
                <strong>Style</strong>
                <span>${escapeHtml(comic.style)}</span>
            </div>

        </div>
    `;


    panelsContainer.innerHTML = "";


    const panels = comic.panels || [];


    panels.forEach((panel) => {

        const panelElement = document.createElement("article");

        panelElement.className = "panel";


        let imageHTML = "";

        if (panel.image_url) {

            imageHTML = `
                <img
                    class="panel-image"
                    src="${escapeHtml(panel.image_url)}"
                    alt="Comic panel ${panel.panel_number}"
                    loading="lazy"
                >
            `;

        } else {

            imageHTML = `
                <div class="no-image">
                    Image generation failed.<br>
                    ${escapeHtml(panel.image_error || "Unknown error")}
                </div>
            `;

        }


        panelElement.innerHTML = `

            <div class="panel-header">
                <h3>
                    Panel ${panel.panel_number} —
                    ${escapeHtml(panel.title)}
                </h3>
            </div>

            ${imageHTML}

            <div class="panel-content">

                <h4>
                    ${escapeHtml(panel.title)}
                </h4>

                <p>
                    <strong>Scene:</strong><br>
                    ${escapeHtml(panel.scene)}
                </p>

                <p>
                    <strong>Narration:</strong><br>
                    ${escapeHtml(panel.narration)}
                </p>

                ${
                    panel.dialogue
                    ?
                    `
                    <div class="dialogue">
                        💬 ${escapeHtml(panel.dialogue)}
                    </div>
                    `
                    :
                    ""
                }

            </div>
        `;


        panelsContainer.appendChild(panelElement);

    });


    window.scrollTo({
        top: result.offsetTop - 20,
        behavior: "smooth"
    });

}


form.addEventListener("submit", async function(event) {

    event.preventDefault();


    button.disabled = true;

    button.textContent = "⏳ Creating Comic...";


    result.style.display = "none";

    showStatus(
        "AI is creating your story and comic images. Please wait...",
        ""
    );


    try {

        const formData = new FormData(form);


        const response = await fetch("/generate", {

            method: "POST",

            body: formData

        });


        const data = await response.json();


        if (!response.ok) {

            throw new Error(
                data.detail ||
                "Comic generation failed."
            );

        }


        if (!data.success) {

            throw new Error(
                "Comic generation was not successful."
            );

        }


        const comic = data.comic;


        showStatus(
            `Comic created successfully! ${data.comic.image_count} images generated.`,
            "success"
        );


        renderComic(comic);


    } catch (error) {

        console.error(error);


        showStatus(
            "Error: " + error.message,
            "error"
        );

    } finally {

        button.disabled = false;

        button.textContent = "✨ Generate Comic";

    }

});

</script>
