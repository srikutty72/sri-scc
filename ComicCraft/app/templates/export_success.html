<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Export Successful - ComicCraft AI</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: Arial, sans-serif;
            background:
                radial-gradient(circle at top, #35205f, #120d1d 55%, #08060c);
            color: white;
        }

        .card {
            width: 90%;
            max-width: 650px;
            text-align: center;
            padding: 50px 35px;
            background: rgba(255,255,255,0.08);
            border: 1px solid rgba(255,255,255,0.15);
            border-radius: 25px;
            box-shadow: 0 20px 70px rgba(0,0,0,0.4);
        }

        .icon {
            font-size: 70px;
            margin-bottom: 20px;
        }

        h1 {
            font-size: 40px;
            margin-bottom: 15px;
        }

        p {
            color: #cfc7d8;
            font-size: 18px;
            line-height: 1.7;
        }

        .filename {
            margin: 25px 0;
            padding: 15px;
            background: #191321;
            border-radius: 12px;
            color: #ddd;
        }

        .button {
            display: inline-block;
            margin: 10px;
            padding: 15px 28px;
            border-radius: 12px;
            text-decoration: none;
            color: white;
            font-weight: bold;
            background: linear-gradient(90deg, #7c3aed, #ec4899);
        }

        .secondary {
            background: #292230;
            border: 1px solid #4a3b55;
        }
    </style>
</head>

<body>

<div class="card">

    <div class="icon">
        ✅
    </div>

    <h1>
        Comic Export Successful!
    </h1>

    <p>
        Your ComicCraft comic has been successfully created
        and exported.
    </p>


    {% if filename %}
    <div class="filename">
        📄 {{ filename }}
    </div>
    {% endif %}


    {% if file_url %}
    <a
        href="{{ file_url }}"
        class="button"
        target="_blank"
    >
        📥 Open Exported Comic
    </a>
    {% endif %}


    <a
        href="/"
        class="button secondary"
    >
        🏠 Back to ComicCraft
    </a>

</div>

</body>
</html>
